name: Build Luna Agent

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci

      - name: Build Tauri
        run: npm run tauri build -- --verbose
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}

      - name: List artifacts
        run: Get-ChildItem -Path "src-tauri/target" -Recurse -Filter "*.exe" | Select-Object FullName, Length

      - name: Upload exe
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luna-agent-windows
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/luna-agent.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: warn
