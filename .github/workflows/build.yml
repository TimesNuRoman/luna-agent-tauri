name: Build Luna Agent

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci

      - name: Build Tauri
        run: npm run tauri build

      - name: Find all output files
        run: |
          Write-Host "=== ALL FILES ==="
          Get-ChildItem . -Recurse -Include "*.exe","*.msi" -File | ForEach-Object { Write-Host "$($_.FullName) [$([math]::Round($_.Length/1MB,2)) MB]" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luna-agent-v2
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/luna-agent.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            dist/
