name: Build Luna Agent

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci

      - name: Build Tauri
        run: npm run tauri build

      - name: Show build outputs
        run: |
          echo "=== dist/ ==="
          Get-ChildItem -Recurse dist/ -File | Select-Object FullName, Length
          echo "=== target ==="
          Get-ChildItem -Path "src-tauri/target" -Directory | Select-Object Name
          echo "=== release ==="
          if (Test-Path "src-tauri/target/release") {
            Get-ChildItem "src-tauri/target/release" -File | Select-Object Name, Length
          }
          echo "=== bundle ==="
          Get-ChildItem "src-tauri/target" -Recurse -Include "*.exe","*.msi" | Select-Object FullName, Length

      - name: Upload all artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luna-agent-windows
          path: |
            dist/
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/
